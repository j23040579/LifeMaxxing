name: life_maxxing
description: "LifeMaxxing — a calm, practical personal assistant that plans your day with the principles of books and notes you imported."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  uuid: ^4.3.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  go_router: ^14.0.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.2.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/